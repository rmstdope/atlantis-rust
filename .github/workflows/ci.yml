name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: ./scripts/gate-full.sh
