# What each agent runs on: which tool, which model, how hard it thinks. Written by
# .cerebro/cerebro/scripts/install and edited by hand; .cerebro/cerebro/agents.conf.example is the shape.
# The most specific line wins whole: the agent's own name, then its role, then `default'.

default       tool=copilot  model=gpt-6-luna  effort=xhigh
architect     tool=copilot  model=gpt-6.1-sol effort=medium
ux	      tool=copilot  model=opus-5.5    effort=medium

